<div class="table-bordered">
      <div class="d-flex justify-content-between align-items-center bg-light border-bottom px-3 py-2">
                    <strong>{{ entregable.estado }}</strong>
                </div>
    <div class="card-header d-flex justify-content-between align-items-center">
        <div class="w-100">
            <div class="font-weight-bold mb-1 subtitle">{{ entregable | entregableResumen }}</div>
            <div class="row col-12">
                <span>Fecha última entrega:
                    <span class="font-weight-bold" [ngClass]="{ 'text-danger': fechaEntregaParaProveedor()}">{{ entregable.fechaComprometida | date:'dd/MM/yyyy' }}</span>
                </span>
                <span class="ml-4"> Cantidad:
                    <span class="font-weight-bold">{{ obtenerCantidadEntregable(entregable) }}</span>
                </span>
            </div>
            <div class="row">
                <div class="col-md-12">Cantidad pendiente de entrega:
                <span class="font-weight-bold">{{ cantidadesPendienteEntrega() }} </span>
                 </div>
            </div>
        </div>
        <app-boton-accion [acciones]="obtenerAccionesEntregable()"
         [ariaLabelMasOpciones]="'Mas opciones del entregable id '+ entregable.idEntregable" class="align-self-start"></app-boton-accion>
    </div>
</div>
<div class="entregas">
    <div  *ngFor="let entrega of entregable.entregas; let i = index" class="">
        <app-entrega [entrega]="entrega" (seleccionado)="seleccionarEntrega($event)"
        [usuarioLogueadoTienePermisosRecepcion]="tienePermisoRecepcion"
        [itemOrdenCompra]="itemOrdenCompra"  [style.position]="'relative'"  [style.z-index]="2000-i" [ordenCompra]="ordenCompra" [entregable]="entregable"
        (actualizarEvento)="actualizarEntregable(entregable)"></app-entrega>
    </div>
</div>
