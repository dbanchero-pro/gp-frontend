<div class="container-fluid p-4">
   <div class="row">
      <div class="col-md-8">
        <h4>{{ titulo }}</h4>
      </div>
      <div class="col-md-4">
        <span class="float-right text-muted">Los campos con * son obligatorios</span>
      </div>
  </div>

  <div class="row">
    <div class="col-12">
      <form [formGroup]="form">
        <div class="Box Box--colorInfo">
          <span class="subtitle mb-0">{{ clausulaInfo?.denominacion || 'Sin especificar' }}</span>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="form-group col-2">
              <label for="prioridad">* Prioridad</label>
              <input type="number" class="form-control" id="prioridad" formControlName="prioridad">
              <div *ngIf="form.controls.prioridad.invalid && form.controls.prioridad.touched" class="text-danger">
                <small *ngIf="form.controls.prioridad.errors?.['required']">La prioridad es obligatoria</small>
                <small *ngIf="form.controls.prioridad.errors?.['min']">La prioridad debe ser mayor a 0</small>
              </div>
            </div>

            <div class="form-group">
              <label for="redaccion">* Redacción</label>
              <app-text-editor formControlName="redaccion"></app-text-editor>
              <div *ngIf="form.controls.redaccion.invalid && form.controls.redaccion.touched" class="text-danger">
                <small>La redacción es obligatoria</small>
              </div>
              <small class="form-text text-muted">
                Para incluir campos personalizados en la redacción, use la sintaxis [[ETIQUETA_CAMPO]]
              </small>
              <div class="mt-2">
                <button type="button" id="btnAgregarCampoDinamico" class="btn btn-primary" (click)="navegarACamposDinamicos()">
                  Agregar campo dinámico
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>


       <div class="col-12">
            <div class="d-flex justify-content-end mt-3 pe-3">
                <button class="btn btn-primary" type="submit" (click)="aceptar()">Aceptar</button>
                <div class="btn-back d-flex justify-content-end">   
                    <button class="btn btn-link" type="button" (click)="volver()">Cancelar</button>
                </div>
            </div>
        </div>

    </div>
  </div>
</div>
