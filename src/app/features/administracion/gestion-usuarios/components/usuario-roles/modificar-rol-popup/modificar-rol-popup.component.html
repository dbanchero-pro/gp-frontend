<div class="modal-header d-flex justify-content-between align-items-center">
    <h1 class="modal-title mb-0" id="tituloPopup">Modificar roles</h1>
    <button type="button" aria-label="Cerrar" class="close" (click)="cancelar()">&times;</button>
</div>

<div class="modal-body justify-content-center">
    <app-mensaje [messages]="resultMsg" [showMsg]="showMsg" [typeMsg]="typeMsg"></app-mensaje>
    <form [formGroup]="form" class="col-12" (submit)="guardar()">
        <div class="row mb-3">
            <div class="col-12">
                <p class="mb-1"><strong>CI:</strong> {{ permiso?.nroDocumento | formatoCi }}</p>
                <p class="mb-1"><strong>Nombre:</strong> {{ permiso?.nombre }}</p>
            </div>
        </div>
        <div class="row">
            <div class="form-group form-row col-12 mb-4" [class.field-error]="!alMenosUnRolSeleccionado() && intentoGuardar">
                <label for="roles" class="font-weight-bold">* Roles</label>
                <div class="d-flex justify-content-center w-100">
                    <div class="border rounded p-3 bg-light d-flex flex-column align-items-start" style="width: 100%; padding-left: 40% !important;">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esEditorPrincipal"
                                formControlName="esEditorPrincipal">
                            <label class="form-check-label" for="esEditorPrincipal">
                                Editor principal
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esEditor"
                                formControlName="esEditor">
                            <label class="form-check-label" for="esEditor">
                                Editor
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esValidador"
                                formControlName="esValidador">
                            <label class="form-check-label" for="esValidador">
                                Validador
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esAprobador"
                                formControlName="esAprobador">
                            <label class="form-check-label" for="esAprobador">
                                Aprobador
                            </label>
                        </div>
                    </div>
                </div>
                <span class="texto-error" [style.visibility]="!alMenosUnRolSeleccionado() && intentoGuardar ? 'visible' : 'hidden'">
                    Debe seleccionar al menos un rol
                </span>
            </div>
        </div>
    </form>
    <div class="d-flex justify-content-end mt-3 pe-3">
        <button type="submit" class="btn btn-primary" (click)="guardar()" [disabled]="guardando">
            Guardar
        </button>
        <button type="button" class="btn btn-link" (click)="cancelar()">Cancelar</button>
    </div>
</div>
