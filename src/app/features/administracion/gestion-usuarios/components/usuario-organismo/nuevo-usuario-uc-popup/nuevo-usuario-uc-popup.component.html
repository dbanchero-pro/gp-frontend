<div class="modal-header d-flex justify-content-between align-items-center">
    <h1 class="modal-title mb-0" id="tituloPopup">{{titulo}}</h1>
    <button type="button" aria-label="Cerrar" class="close" (click)="cancelarConConfirmacion()">&times;</button>
</div>

<div class="modal-body justify-content-center">
    <app-mensaje [messages]="resultMsg" [showMsg]="showMsg" [typeMsg]="typeMsg"></app-mensaje>
    <form [formGroup]="form" class="col-12 justify-content-center" (submit)="guardar()">

        <app-filtro-organismo formControlName="organismo" [requeridoInciso]="true" [requeridoUC]="true"
            [requeridoUE]="true" (cambioFiltro)="onCambioFiltro($event)">
        </app-filtro-organismo>

        <div class="row">
            <div class="form-group form-row col-12 mb-4" [class.field-error]="campoVacio('usuario')">
                <label for="usuario">* Usuario</label>
                <select class="form-control" [attr.disabled]="noSeEncontraronUsuarios ? 'disabled' : null"
                    formControlName="usuario" id="usuario">
                    <option *ngIf="!noSeEncontraronUsuarios" [value]="''">Seleccione un usuario</option>
                    <option *ngIf="noSeEncontraronUsuarios" [value]="''">No se encontraron usuarios</option>
                    <option *ngFor="let usr of usuarios" [value]="usr.id">{{'CI ' + (usr.nroDocumento | formatoCi) + ' - ' + usr.nombre }}</option>
                </select>
                <span class="texto-error" [style.visibility]="campoVacio('usuario') ? 'visible' : 'hidden'">
                    El usuario no puede estar vacío
                </span>
            </div>
        </div>

        <div class="row">
            <div class="form-group form-row col-12 mb-4" [class.field-error]="!alMenosUnRolSeleccionado() && intentoGuardar">
                <label for="roles" class="font-weight-bold">* Roles</label>
                <div class="d-flex justify-content-center w-100">
                    <div class="border rounded p-3 bg-light d-flex flex-column align-items-start" style="width: 100%; padding-left: 40% !important;">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esEditorPrincipal"
                                formControlName="esEditorPrincipal">
                            <label class="form-check-label" for="esEditorPrincipal">
                                Editor principal
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esEditor"
                                formControlName="esEditor">
                            <label class="form-check-label" for="esEditor">
                                Editor
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esValidador"
                                formControlName="esValidador">
                            <label class="form-check-label" for="esValidador">
                                Validador
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="esAprobador"
                                formControlName="esAprobador">
                            <label class="form-check-label" for="esAprobador">
                                Aprobador
                            </label>
                        </div>
                    </div>
                </div>
                <span class="texto-error" [style.visibility]="!alMenosUnRolSeleccionado() && intentoGuardar ? 'visible' : 'hidden'">
                    Debe seleccionar al menos un rol
                </span>
            </div>
        </div>
    </form>
    <div class="d-flex justify-content-end mt-3 pe-3">
        <button type="submit" class="btn btn-primary" (click)="guardar()" [disabled]="validarPopUpInvalido()">
            Guardar
        </button>
        <button type="button" class="Button btn-link" (click)="cancelarConConfirmacion()">Cancelar</button>
    </div>
</div>
