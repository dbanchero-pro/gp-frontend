<div class="modal-header d-flex justify-content-between align-items-center">
  <h1 class="modal-title mb-0" id="tituloPopup">{{titulo}}</h1>
  <button type="button" aria-label="Cerrar" class="close" (click)="cerrarPopup()">&times;</button>
</div>

<div class="modal-body justify-content-center">
  <div>
    <app-mensaje [messages]="resultMsg" [showMsg]="showMsg" [typeMsg]="typeMsg"></app-mensaje>
  </div>
  <form [formGroup]="form" class="col-12 col-lg-9" (submit)="guardar()">
    <div class="form-group">
      <div class="form-row col-12 pl-2">
        <div class="form-group col-md-7">
          <app-input-documento #inputDocumento formControlName="nroDocumento" [esCedula]="true" [minLength]="7"
            [required]="true" label="Cédula de identidad">
          </app-input-documento>
        </div>

        <div class="form-group col-md-3 d-flex align-items-center justify-content-end"
          style="margin-top: 1.6rem; margin-bottom: 0px;">
          <button type="button" class="Button btn btn-primary buttonFilter" [disabled]="form.get('nroDocumento')!.invalid"
            (click)="buscar()" [disabled]="buscando">
            <em class="fa fa-search"></em>
            Buscar
          </button>
        </div>
      </div>
      <div class="form-group px-0">
        <label for="" class="col-3 pl-0 font-weight-bold" *ngIf="usuario">{{usuario.nombre}}</label>
        <label for="" class="col-3 pl-0 font-weight-bold" *ngIf="usuario">{{usuario.correo}}</label>
      </div>
    </div>

    <div class="form-group" [class.field-error]="form.get('idTipoCompra')!.invalid && intentoGuardar">
      <label for="idTipoCompra" class="font-weight-bold">* Tipo de compra</label>
      <select id="idTipoCompra" class="form-control" formControlName="idTipoCompra">
        <option value="">Seleccione un tipo de compra</option>
        <option *ngFor="let t of tiposCompra" [value]="t.id">{{ t.id }} - {{ t.descTipoCompra }}</option>
      </select>
      <span class="texto-error"
        [style.visibility]="form.get('idTipoCompra')!.invalid && intentoGuardar ? 'visible' : 'hidden'">
        Debe seleccionar un tipo de compra
      </span>
    </div>

    <div class="form-group">
      <div class="form-row col-12 mb-4" [class.field-error]="!alMenosUnRolSeleccionado() && intentoGuardar">
        <label for="roles" class="font-weight-bold col-12">* Roles</label>
        <div class="d-flex justify-content-center w-100 col-12">
          <div class="border rounded p-3 bg-light d-flex flex-column align-items-start"
            style="width: 100%; padding-left: 40% !important;">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="esEditorPrincipal"
                formControlName="esEditorPrincipal">
              <label class="form-check-label" for="esEditorPrincipal">
                Editor principal
              </label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="esEditor" formControlName="esEditor">
              <label class="form-check-label" for="esEditor">
                Editor
              </label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="esValidador" formControlName="esValidador">
              <label class="form-check-label" for="esValidador">
                Validador
              </label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="esAprobador" formControlName="esAprobador">
              <label class="form-check-label" for="esAprobador">
                Aprobador
              </label>
            </div>
          </div>
        </div>
        <span class="texto-error col-12"
          [style.visibility]="!alMenosUnRolSeleccionado() && intentoGuardar ? 'visible' : 'hidden'">
          Debe seleccionar al menos un rol
        </span>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3 pe-3">
      <button type="submit" class="btn btn-primary" (click)="guardar()" [disabled]="deshabilitarGuardar">
        Guardar
      </button>
      <button type="button" class="Button btn-link" (click)="cerrarPopup()">Cancelar</button>
    </div>
  </form>
</div>
