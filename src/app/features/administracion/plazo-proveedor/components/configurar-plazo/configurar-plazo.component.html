<div class="mb-2 mr-2 text-muted float-right" style="font-size: 0.95rem;">
    Los campos con * son obligatorios
</div>
<div class="card col-12 justify-content-center">
    <div class="card-body">

        <form [formGroup]="form" (ngSubmit)="guardar()" class="d-flex justify-content-center">
            <div class="col-12 col-sm-12 col-md-9 col-lg-8">                               
                <div class="row" *ngIf="proveedores.length >= 1">
                    <div class="col-12 col-md-10 col-lg-8 position-relative" [class.field-error]="campoVacio('proveedor')">
                        <label for="proveedor" class="form-label">* Proveedor</label>
                        <select id="proveedor" class="form-control" formControlName="proveedor" (change)="cambioProveedor($event)"> >
                            <option value="">Seleccione un proveedor</option>
                            <option *ngFor="let proveedor of proveedores" [value]="proveedor.id">{{proveedor | proveedor}}
                            </option>
                        </select>
                        <span class="texto-error position-absolute" [style.visibility]="campoVacio('proveedor') ? 'visible' : 'hidden'">
                            El proveedor no puede estar vacío.
                        </span>
                    </div>
                </div>
                <div class="row pt-4 mb-4">
                    <div class="col-12 col-md-10 col-lg-8 position-relative" [class.field-error]="campoVacio('cantidadDias')">
                        <label for="cantidadDias" class="form-label">* Cantidad días antes del vencimiento de la entrega</label>
                        <input type="number" id="cantidadDias" class="form-control col-3" formControlName="cantidadDias">
                        <span class="texto-error position-absolute" [style.visibility]="campoVacio('cantidadDias') ? 'visible' : 'hidden'">
                            El cantidad de días no puede estar vacío.
                        </span>
                    </div>
                </div>


                <div class="row">
                    <div class="col-8 d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>
