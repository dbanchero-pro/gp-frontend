<div class="card p-3 mb-3">
    <div class="row">
        <div class="col-md-10">
            <div class="row mb-1" *ngIf="documento">
                <div class="col-3 text-right">Documento</div>
                <div class="col-9 font-weight-bold">
                    {{ formatearDocumento(usuario.id) }}
                </div>
            </div>
            <div class="row mb-1">
                <div class="col-3 text-right">Nombre</div>
                <div class="col-9 font-weight-bold">{{ usuario.nombre }}</div>
            </div>
            <div class="row mb-1" *ngIf="correo">
                <div class="col-3 text-right">Correo electrónico</div>
                <div class="col-9 font-weight-bold">{{ usuario.correo }}</div>
            </div>
        </div>
        <div class="col-md-2 d-flex align-items-center justify-content-end">
            <button class="btn border" (click)="ejecutarAccionEliminar()">
                <i class="fa fa-user-times mr-1"></i> Eliminar
            </button>
        </div>
    </div>
</div>
