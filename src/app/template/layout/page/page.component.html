<div class="row" *ngIf="titulo">
    <div class="col-12" >
        <h1 class="mx-0 col-12" >{{ titulo }}</h1>

<header class="mx-0 col-12"  *ngIf="subTitulo">

></app-mensaje>
<ng-content> </ng-content>
<app-footer></app-footer>
